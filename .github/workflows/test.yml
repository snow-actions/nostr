name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - run: npm run test:coverage
      - name: Add coverage summary
        run: |
          node -e '
            const fs = require("fs");
            const coverage = require("./coverage/coverage-summary.json").total;
            const metrics = ["statements", "branches", "functions", "lines"];
            const rows = metrics.map((metric) => `| ${metric[0].toUpperCase() + metric.slice(1)} | ${coverage[metric].pct.toFixed(1)}% |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Unit test coverage\n\n| Metric | Coverage |\n| --- | ---: |\n${rows.join("\n")}\n`);
          '

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Package
        run: |
          npm ci
          npm run package

      - name: Add bundle size summary
        run: |
          bytes=$(wc -c < dist/index.js)
          kib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.1f", bytes / 1024 }')
          printf '## Bundle size\n\n| File | Size |\n| --- | ---: |\n| `dist/index.js` | %d bytes (%s KiB) |\n' "$bytes" "$kib" >> "$GITHUB_STEP_SUMMARY"

      - name: Default is kind 1
        uses: ./
        with:
          relays: ${{ vars.NOSTR_RELAYS_TEST }}
          private-key: ${{ secrets.NOSTR_PRIVATE_KEY_TEST }}
          content: |
            test
            https://github.com/snow-actions/nostr
        id: publish
      - run: test $(echo "$event" | jq '.kind') = 1
        env:
          event: ${{ steps.publish.outputs.event }}
      - run: test "$event" != ''
        env:
          event: ${{ steps.publish.outputs.event }}

      - name: Reply with tags
        uses: ./
        with:
          relays: ${{ vars.NOSTR_RELAYS_TEST }}
          private-key: ${{ secrets.NOSTR_PRIVATE_KEY_TEST }}
          content: test reply
          tags: |
            - ["e", "${{ fromJson(steps.publish.outputs.event).id }}", "", "root"]
            - ["p", "${{ fromJson(steps.publish.outputs.event).pubkey }}"]
        id: publish-reply
      - run: test "$event" != ''
        env:
          event: ${{ steps.publish-reply.outputs.event }}

      - name: Specify kind
        uses: ./
        with:
          relays: ${{ vars.NOSTR_RELAYS_TEST }}
          private-key: ${{ secrets.NOSTR_PRIVATE_KEY_TEST }}
          content: wss://relay.nostr.wirednet.jp
          kind: 2
        id: publish-kind
      - run: test $(echo "$event" | jq '.kind') = 2
        env:
          event: ${{ steps.publish-kind.outputs.event }}

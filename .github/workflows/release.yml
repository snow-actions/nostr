name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true

jobs:
  release:
    if: (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Resolve release
        id: release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="${RELEASE_BRANCH#release/}"
            target="$MERGE_COMMIT_SHA"
          else
            version="$INPUT_VERSION"
            target="$WORKFLOW_SHA"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.sha }}
      - name: Create release
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --discussion-category Announcements \
            --target "$TARGET"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Trigger next CI
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}

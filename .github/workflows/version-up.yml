name: Version up

on:
  workflow_dispatch:
    inputs:
      semantic:
        description: Semantic versioning
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  version-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }} # Commit workflow file
      - name: Package
        run: |
          npm ci
          npm run package
      - name: Update version
        id: version
        run: |
          version=$(npm --no-git-tag-version version "$SEMANTIC")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          sed -i -e "s|${GITHUB_REPOSITORY}@v[.0-9]\+|${GITHUB_REPOSITORY}@${version}|g" README.md
          sed -i -e "s|${GITHUB_REPOSITORY}@v[.0-9]\+|${GITHUB_REPOSITORY}@${version}|g" .github/workflows/released.yml
          git diff
        env:
          SEMANTIC: ${{ inputs.semantic }}
      - uses: snow-actions/git-config-user@84b24d833b169b1a874be9fae7a7128a57babba2 # v1.0.0
      - name: Create release pull request
        run: |
          branch="release/${VERSION}"
          git switch -c "$branch"
          git add .
          git commit -m "$VERSION"
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --assignee "$GITHUB_ACTOR" \
            --title "$VERSION" \
            --body ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Trigger next CI
